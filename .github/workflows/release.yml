name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.4.0)"
        required: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-15, windows-2022 ]
      fail-fast: true
    name:  ${{ matrix.os }} build
    steps:
    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt update && sudo apt install -y libgl1-mesa-dev xorg-dev libasound2-dev libcurl4-openssl-dev libjack-jackd2-dev

    - uses: actions/checkout@v4
      with:
        submodules: "recursive"

    - name: Set up MSVC compiler
      if: matrix.os == 'windows-2022'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset github-${{ runner.os }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build --preset github-${{ runner.os }} --parallel 6

    - name: Pack
      run: cpack --preset github-${{ runner.os }}

    - name: Create Changelog
      if: matrix.os == 'ubuntu-latest'
      run: ${{github.workspace}}/bin/tools/changelogGenerator -i ${{github.workspace}}/doc/changelog.txt -o ${{github.workspace}}/doc/changelog_split

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.os }}
        path: |
          build/*${{ github.event.inputs.version }}*.zip
          build/*${{ github.event.inputs.version }}*.rpm
          build/*${{ github.event.inputs.version }}*.deb
        if-no-files-found: error

    - name: Upload changelog
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: release-changelog
        path: |
          doc/changelog.txt
          doc/changelog_split/${{ github.event.inputs.version }}.txt
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body_path: artifacts/release-changelog/changelog_split/${{ github.event.inputs.version }}.txt
        draft: true
        prerelease: false
        name: ${{ github.event.inputs.version }}
        tag_name: ${{ github.event.inputs.version }}
        files: |
          artifacts/packages-*/*${{ github.event.inputs.version }}*.zip
          artifacts/packages-*/*${{ github.event.inputs.version }}*.rpm
          artifacts/packages-*/*${{ github.event.inputs.version }}*.deb
          artifacts/release-changelog/changelog.txt
